<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой фокус | Трекер задач</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
        <h1>Мой фокус</h1>
        <p class="subtitle">Что нужно сделать сегодня?</p>


        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Новая задача...">
            <button id="addBtn">Добавить</button>
        </div>
        <!--filters-->
        <div class="filters">
            <button class="filter-btn active" data-filter="all">Все</button>
            <button class="filter-btn"data-filter>Активные</button>
            <button class="filter-btn"data-filter>Выполненные</button>
        </div>
        <!--clearBtn-->
        <button id="clearCompletedBtn" class="clear-btn">Очистить выполненные</button>

        <!--lists tasks-->
        <ul id="taskList">

        </ul>
        <div class="counter" id="counter">
            Выполнено: 0 из 0
        </div>
    </div>



    <script src="script.js"></script>
</body>
</html>
