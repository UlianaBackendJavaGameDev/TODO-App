<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой фокус | Трекер задач</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="favicon.svg" type="image/x-icon">
</head>
<body>
    
    <div class="container">
        <div class="app-header">
            <div>
                <h1>Мой фокус</h1>
        <p class="subtitle">Что нужно сделать сегодня?</p>
            </div>
            <div class="theme-switcher">
                <button class="theme-btn" data-theme-value="light" title="Светлая">☀️</button>
                <button class="theme-btn" data-theme-value="dark" title="Темная">🌙</button>
                <button class="theme-btn" data-theme-value="horror" title="Хоррор">💀</button>
            </div>
        </div>
        


        <div class="input-group" style="flex-direction: column; gap: 10px;">
            <div style="display: flex; gap: 10px;"><input type="text" id="taskInput" placeholder="Новая задача...">
            <button id="addBtn">Добавить</button>
        </div>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <input type="date" id="taskDeadline" title="Дедлайн">


            <select  id="taskPriority">
                <option value="low">Низкий приоритет</option>
                <option value="medium" selected>Средний приоритет</option>
                <option value="high" >Высокий приоритет</option>
            </select>
            <select id="taskCategory">
                <option value="work">Работа</option>
                <option value="study" selected>Учёба</option>
                <option value="course" >Курс</option>
                <option value="rest" >Отдых</option>
            </select>
        </div>
            
        </div>
        <!--filters-->
        <div class="filters">
            <button class="filter-btn active" data-filter="all">Все</button>
            <button class="filter-btn"data-filter="active">Активные</button>
            <button class="filter-btn"data-filter="completed">Выполненные</button>
        </div>
        <!--clearBtn-->
        <button id="clearCompletedBtn" class="clear-btn">Очистить выполненные</button>

        <!--lists tasks-->
        <ul id="taskList">

        </ul>
        <div class="counter" id="counter">
            Выполнено: 0 из 0
        </div>
    </div>



    <script src="script.js"></script>
</body>
</html>
